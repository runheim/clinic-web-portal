name: Cognitive Edge Clinic — Continuous Synthetic Watchdog

on:
  schedule:
    # Run every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target Edge URL to probe"
        required: false
        default: "https://cognitive-wellness.netlify.app"

jobs:
  synthetic-probe:
    name: "Live Edge Health & Zero-ePHI Watchdog"
    runs-on: ubuntu-latest
    env:
      LIVE_URL: ${{ github.event.inputs.target_url || 'https://cognitive-wellness.netlify.app' }}

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Probe Live HTTPS Routes & Edge Headers
        run: |
          echo "Executing live edge probe against $LIVE_URL..."
          npx ts-node scripts/verify-live-edge.ts "$LIVE_URL"

      - name: Validate TLS Certificate Expiration
        run: |
          echo "Inspecting SSL/TLS certificate validity..."
          npx ts-node scripts/verify-dns.ts cognitive-wellness.netlify.app

      - name: Zero-ePHI Live Edge Payload Leak Scan
        run: |
          echo "Auditing public response bodies for unauthorized ePHI or secret leakages..."
          PROBE_ROUTES=("/" "/services" "/ledger" "/vault" "/api/health")
          for route in "${PROBE_ROUTES[@]}"; do
            echo "Inspecting $LIVE_URL$route..."
            PAYLOAD=$(curl -s -L "$LIVE_URL$route")
            
            # Check for leaked secrets
            if echo "$PAYLOAD" | grep -E -q '(sk_live_|whsec_|spruce_live_)'; then
              echo "::error::CRITICAL: Raw secret key detected in public payload at $route!"
              exit 1
            fi
            
            # Check for unmasked ePHI tokens
            if echo "$PAYLOAD" | grep -E -i -q '("ssn"|"mrn"|social[_-]?security|chart[_-]?note)'; then
              echo "::error::CRITICAL: Prohibited ePHI token detected in public payload at $route!"
              exit 1
            fi
          done
          echo "Live edge payload leak scan clean: 0 violations detected."

      - name: Log Watchdog Incident Summary on Failure
        if: failure()
        run: |
          echo "================================================================================"
          echo " [INCIDENT] SYNTHETIC WATCHDOG DETECTED EDGE OR COMPLIANCE DEGRADATION"
          echo " Target Host: $LIVE_URL"
          echo " Timestamp:   $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo " Please inspect Netlify Edge status and vendor enclaves."
          echo "================================================================================"
