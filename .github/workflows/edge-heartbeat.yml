name: Cognitive Edge Clinic — Edge Heartbeat Synthetic Monitor

on:
  schedule:
    # Run every 4 hours: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target Edge URL to probe (defaults to live Netlify deployment)"
        required: false
        default: "https://cognitive-wellness.netlify.app"

jobs:
  edge-heartbeat:
    name: "Synthetic Edge Heartbeat & Zero-Leak Sentinel"
    runs-on: ubuntu-latest
    env:
      LIVE_URL: ${{ github.event.inputs.target_url || 'https://cognitive-wellness.netlify.app' }}

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Synthetic Edge Monitor Sweep
        run: |
          echo "Executing synthetic edge monitor sweep against $LIVE_URL..."
          npx ts-node --project tsconfig.json scripts/monitoring/synthetic-edge-monitor.ts --once

      - name: Incident Alert on Heartbeat Failure
        if: failure()
        run: |
          echo "================================================================================"
          echo " [CRITICAL INCIDENT] SYNTHETIC EDGE HEARTBEAT MONITOR DETECTED FAILURE"
          echo " Target Host: $LIVE_URL"
          echo " Timestamp:   $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo " Please inspect Netlify Edge CDN status and Zero-ePHI Quarantine enforcement."
          echo "================================================================================"
