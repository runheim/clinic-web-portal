name: Cognitive Edge Clinic — Continuous Integration & Edge Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  CI: "true"

jobs:
  # ============================================================================
  # GATE 1: STATIC ANALYSIS & TYPE INTEGRITY
  # ============================================================================
  lint-and-types:
    name: "Gate 1: Lint & Type Validation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Deterministic Dependency Installation
        run: npm ci

      - name: Verify TypeScript Compilation (Strict Mode)
        run: npx tsc --noEmit

      - name: Run ESLint Analysis (Zero Warnings Standard)
        run: npm run lint

  # ============================================================================
  # GATE 2: ZERO-ePHI & PRODUCTION SECRETS AUDIT
  # ============================================================================
  zero-ephi-audit:
    name: "Gate 2: Zero-ePHI Quarantine Audit"
    runs-on: ubuntu-latest
    needs: lint-and-types
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Deterministic Dependency Installation
        run: npm ci

      - name: Execute Zero-ePHI & Edge Header Scanner
        run: npx ts-node scripts/audit-release.ts

      - name: Archive Zero-ePHI Audit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zero-ephi-audit-manifest
          path: audit-report.json
          retention-days: 14

  # ============================================================================
  # GATE 3: JEST UNIT & CRYPTOGRAPHIC TESTS
  # ============================================================================
  unit-tests:
    name: "Gate 3: Jest Unit & Crypto Suites"
    runs-on: ubuntu-latest
    needs: lint-and-types
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Deterministic Dependency Installation
        run: npm ci

      - name: Run Jest Test Batteries
        run: npm run test:unit -- --ci --maxWorkers=2

  # ============================================================================
  # GATE 4: PRODUCTION STANDALONE PACKAGING
  # ============================================================================
  build-standalone:
    name: "Gate 4: Standalone Production Build"
    runs-on: ubuntu-latest
    needs: [zero-ephi-audit, unit-tests]
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Deterministic Dependency Installation
        run: npm ci

      - name: Compile Next.js App Router (Turbopack Standalone)
        run: npm run build

      - name: Verify Standalone Enclave Packaging
        run: |
          if [ ! -d ".next/standalone" ]; then
            echo "::error::Missing .next/standalone bundle!"
            exit 1
          fi
          if [ ! -f ".next/standalone/server.js" ]; then
            echo "::error::Missing standalone server.js entrypoint!"
            exit 1
          fi
          echo "Standalone artifact validated successfully."

  # ============================================================================
  # GATE 5: FULL-PLATFORM PLAYWRIGHT E2E BATTERIES
  # ============================================================================
  e2e-playwright:
    name: "Gate 5: Full-Platform E2E Verification"
    runs-on: ubuntu-latest
    needs: build-standalone
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Deterministic Dependency Installation
        run: npm ci

      - name: Install Playwright Chromium & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Compile Production Build for Playwright
        run: npm run build

      - name: Execute Playwright Verification Suites (14 Tests)
        run: npx playwright test

      - name: Archive Playwright Failure Traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-traces
          path: test-results/
          retention-days: 7

  # ============================================================================
  # GATE 6: NETLIFY EDGE DEPLOYMENT & SMOKE VERIFICATION
  # ============================================================================
  netlify-deploy:
    name: "Gate 6: Netlify Edge Deployment & Smoke Test"
    runs-on: ubuntu-latest
    needs: [build-standalone, e2e-playwright]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Deterministic Dependency Installation
        run: npm ci

      - name: Deploy to Netlify Edge Production
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "Netlify credentials detected. Initiating automated production deployment..."
            npx netlify-cli deploy --build --prod --dir=.next
            echo "Netlify edge deployment completed."
          else
            echo "Netlify credentials not configured in repository secrets (dry-run mode)."
            echo "Validating netlify.toml and build script locally..."
            bash ./build.sh
            echo "Local Netlify build emulation passed."
          fi
