[build]
  command = "./build.sh"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Explicit Proxy Redirection: Diagnostic Vault eCW Portal Bridge
[[redirects]]
  from = "/portal-redirect"
  to = "https://mycwXX.eclinicalworks.com/portal"
  status = 302
  force = true
  headers = { Referrer-Policy = "no-referrer" }

# Static Edge Security Headers (Duplicating Next.js Edge Config for Guaranteed Delivery)
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://app.cal.com https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://images.unsplash.com; media-src 'self' https://commondatastorage.googleapis.com blob: data:; connect-src 'self' https://api.sprucehealth.com https://api.stripe.com https://app.cal.com; frame-src 'self' https://app.cal.com https://js.stripe.com; frame-ancestors 'none'; form-action 'self' https://mycw*.eclinicalworks.com;"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
