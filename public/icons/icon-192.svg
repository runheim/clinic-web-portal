<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A2234" />
      <stop offset="100%" stop-color="#0B0F19" />
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED58A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="96" cy="96" r="92" fill="url(#bgGlow)" stroke="url(#goldGradient)" stroke-width="2.5" />
  
  <!-- Subtle Inner Ring -->
  <circle cx="96" cy="96" r="82" fill="none" stroke="#D4AF37" stroke-width="0.75" stroke-opacity="0.35" stroke-dasharray="3 3" />

  <!-- Monogram CE -->
  <text 
    x="96" 
    y="112" 
    font-family="Cinzel, Cormorant Garamond, 'EB Garamond', Georgia, serif" 
    font-size="64" 
    font-weight="600" 
    letter-spacing="0.05em" 
    fill="url(#goldGradient)" 
    text-anchor="middle"
  >
    CE
  </text>
</svg>
